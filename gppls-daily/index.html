<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>gppls daily</title>
    <meta name="description" content="A new gppls song every day for 365 days.">
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8'/%3E%3Cpath d='M12 9v14l11-7z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://gppls-daily-api.innovativehype.xyz" crossorigin>
    <link rel="stylesheet" href="app.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NM00FT5H0Y"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-NM00FT5H0Y');
    </script>
</head>
<body>
    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.9-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 6.2v11.6a.8.8 0 0 0 1.25.66L13 13.1v4.7a.8.8 0 0 0 1.25.66l8.2-5.8a.8.8 0 0 0 0-1.32l-8.2-5.8A.8.8 0 0 0 13 6.2v4.7L5.25 5.54A.8.8 0 0 0 4 6.2z"/></symbol>
        <symbol id="i-prev" viewBox="0 0 24 24"><path d="M20 6.2v11.6a.8.8 0 0 1-1.25.66L11 13.1v4.7a.8.8 0 0 1-1.25.66l-8.2-5.8a.8.8 0 0 1 0-1.32l8.2-5.8A.8.8 0 0 1 11 6.2v4.7l7.75-5.36A.8.8 0 0 1 20 6.2z"/></symbol>
        <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
        <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
        <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 1 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0z"/></symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M3.3 8.3a1 1 0 0 1 1.4 0L12 14.6l7.3-6.3a1 1 0 1 1 1.3 1.5l-8 7a1 1 0 0 1-1.3 0l-8-7a1 1 0 0 1 0-1.5z"/></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 2.6 7.3 7.3l1.4 1.4L11 6.4V15h2V6.4l2.3 2.3 1.4-1.4L12 2.6zM5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10h-3v2h1v8H7v-8h1v-2H5z"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 5h3v3H4zm5 0h11v3H9zM4 10.5h3v3H4zm5 0h11v3H9zM4 16h3v3H4zm5 0h11v3H9z"/></symbol>
        <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
        <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></symbol>
    </svg>

    <header class="topbar">
        <div class="topbar-inner">
            <button class="icon-btn" id="backButton" aria-label="Back to all days" hidden><svg><use href="#i-chevron-left"/></svg></button>
            <span class="topbar-spacer" id="topbarSpacer"></span>
            <a class="brand" href="#">gppls daily</a>
            <button class="icon-btn" id="searchToggle" aria-label="Search songs" aria-expanded="false" aria-controls="searchRow">
                <svg><use href="#i-search"/></svg>
            </button>
        </div>
        <div class="search-row" id="searchRow" hidden>
            <input type="search" id="searchInput" placeholder="Search by day or title" autocomplete="off" aria-label="Search by day or title">
        </div>
    </header>

    <main class="page">
      <div id="homeView">
        <section class="hero is-loading" id="hero" aria-label="gppls daily">
            <div class="hero-art" id="heroArt"></div>
            <div class="hero-body">
                <p class="eyebrow">Album</p>
                <h1 class="hero-title">gppls daily</h1>
                <p class="hero-sub" id="heroSub">Loading songs…</p>
            </div>
            <div class="hero-actions">
                <button class="pill" id="playAllButton" disabled>
                    <svg><use href="#i-play"/></svg>Play
                </button>
                <button class="pill pill-outline" id="shuffleAllButton" disabled>
                    <svg><use href="#i-shuffle"/></svg>Shuffle
                </button>
            </div>
        </section>

        <section class="playlists" id="playlists" aria-labelledby="playlistsTitle" hidden>
            <h2 class="section-title" id="playlistsTitle">Releases</h2>
            <div class="shelf" id="playlistShelf"></div>
        </section>

        <section aria-labelledby="allDaysTitle">
            <div class="section-head">
                <div>
                    <h2 class="section-title" id="allDaysTitle">All days</h2>
                    <p class="section-meta" id="libraryCount"></p>
                </div>
                <div class="section-tools">
                    <div class="segmented" role="group" aria-label="Sort order">
                        <button data-sort="newest" aria-pressed="true">Newest</button>
                        <button data-sort="oldest" aria-pressed="false">Oldest</button>
                    </div>
                    <div class="segmented" role="group" aria-label="Layout">
                        <button data-view="grid" aria-pressed="true" aria-label="Grid view"><svg><use href="#i-grid"/></svg></button>
                        <button data-view="list" aria-pressed="false" aria-label="List view"><svg><use href="#i-list"/></svg></button>
                    </div>
                </div>
            </div>
            <div class="library grid" id="library"></div>
        </section>
      </div>

        <!-- Playlist / album view -->
        <div id="playlistView" hidden>
            <section class="hero">
                <div class="hero-art" id="plArt"></div>
                <div class="hero-body">
                    <p class="eyebrow" id="plType">Playlist</p>
                    <h1 class="hero-title pl-title" id="plTitle"></h1>
                    <p class="hero-sub" id="plSub"></p>
                    <p class="pl-desc" id="plDesc" hidden></p>
                </div>
                <div class="hero-actions">
                    <button class="pill" id="plPlay"><svg><use href="#i-play"/></svg>Play</button>
                    <button class="pill pill-outline" id="plShuffle"><svg><use href="#i-shuffle"/></svg>Shuffle</button>
                </div>
            </section>
            <div class="library list" id="plTracks"></div>
            <p class="pl-source"><a id="plSoundcloud" href="#" target="_blank" rel="noopener">Open on SoundCloud</a></p>
        </div>
    </main>

    <!-- Mini player -->
    <div class="mini" id="mini" hidden>
        <div class="mini-progress"><span id="miniProgress"></span></div>
        <button class="mini-open" id="miniOpen" aria-label="Open now playing">
            <span class="mini-art" id="miniArt"></span>
            <span class="mini-text">
                <span class="mini-title" id="miniTitle"></span>
                <span class="mini-sub" id="miniSub"></span>
            </span>
        </button>
        <div class="mini-controls">
            <button class="icon-btn hide-sm" data-action="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
            <button class="icon-btn play-btn" data-action="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
            <button class="icon-btn" data-action="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
        </div>
    </div>

    <!-- Full-screen now playing -->
    <div class="np" id="np" role="dialog" aria-modal="true" aria-label="Now playing" hidden>
        <div class="np-bg" id="npBg"></div>
        <div class="np-inner">
            <div class="np-top">
                <button class="icon-btn" id="npClose" aria-label="Close now playing"><svg><use href="#i-chevron-down"/></svg></button>
                <div class="np-context">
                    <span class="np-context-label">Playing from</span>
                    <strong id="npContext">gppls daily</strong>
                </div>
                <button class="icon-btn" id="npShare" aria-label="Share this song"><svg><use href="#i-share"/></svg></button>
            </div>

            <div class="np-art" id="npArt"></div>

            <div class="np-meta">
                <button class="icon-btn toggle" id="repeatButton" aria-label="Repeat: off"><svg><use href="#i-repeat"/></svg></button>
                <div class="np-titles">
                    <h2 id="npTitle"></h2>
                    <p id="npSub"></p>
                </div>
                <button class="icon-btn toggle" id="shuffleButton" aria-label="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
            </div>

            <div class="np-seek">
                <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
                <div class="np-times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
            </div>

            <div class="np-controls">
                <button class="icon-btn lg" data-action="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
                <button class="icon-btn play-btn xl" data-action="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
                <button class="icon-btn lg" data-action="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
            </div>

            <div class="np-links">
                <a class="pill pill-outline pill-sm" id="npSoundcloud" href="#" target="_blank" rel="noopener" hidden>Listen on SoundCloud</a>
            </div>

            <div class="np-volume">
                <button class="icon-btn" id="muteButton" aria-label="Mute"><svg><use href="#i-volume"/></svg></button>
                <input type="range" id="volume" min="0" max="100" value="100" aria-label="Volume">
            </div>

            <section class="up-next" id="upNextSection">
                <h3 class="section-title">Up next</h3>
                <ol id="upNext"></ol>
            </section>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
